<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CineSpeak AI – Movie English Enhancement</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Exo+2:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--deep-navy:#020818;--navy:#040f2e;--mid-navy:#071540;--accent-blue:#1a4dcc;--bright-blue:#2d6fff;--cyan:#00d4ff;--gold:#f0b429;--white:#e8f0ff;--muted:#7a90c0;--card-bg:rgba(7,21,64,0.75);--glass:rgba(45,111,255,0.08);--border:rgba(45,111,255,0.25);--green:#4dff91;--red:#ff6060;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Exo 2',sans-serif;background:var(--deep-navy);color:var(--white);min-height:100vh;overflow-x:hidden;}
#stars-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;opacity:.16;}
.orb-1{width:500px;height:500px;background:var(--bright-blue);top:-150px;right:-100px;}
.orb-2{width:400px;height:400px;background:var(--cyan);bottom:-100px;left:-100px;}
.orb-3{width:350px;height:350px;background:#4a1dff;top:50%;left:50%;transform:translate(-50%,-50%);}
.page{display:none;position:relative;z-index:1;min-height:100vh;}
.page.active{display:block;}
nav{position:sticky;top:0;z-index:100;background:rgba(2,8,24,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;height:64px;}
.nav-brand{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:800;color:var(--cyan);letter-spacing:2px;cursor:pointer;text-shadow:0 0 20px rgba(0,212,255,.5);}
.nav-brand span{color:var(--gold);}
.nav-links{display:flex;gap:.2rem;list-style:none;}
.nav-links a{font-family:'Exo 2',sans-serif;font-weight:500;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:.45rem 1rem;border-radius:4px;transition:all .25s;cursor:pointer;}
.nav-links a:hover,.nav-links a.active{color:var(--cyan);background:rgba(0,212,255,.08);}
.nav-cta{background:linear-gradient(135deg,var(--bright-blue),var(--cyan));color:var(--deep-navy)!important;font-weight:700!important;padding:.45rem 1.4rem!important;border-radius:20px!important;}
.nav-cta:hover{opacity:.85;}
.hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 2rem;}
.hero-badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);border-radius:20px;padding:.35rem 1.1rem;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:2rem;animation:fadeDown .8s ease both;}
.hero h1{font-family:'Orbitron',sans-serif;font-size:clamp(2.2rem,5vw,4.2rem);font-weight:900;line-height:1.1;letter-spacing:1px;margin-bottom:1.5rem;animation:fadeDown .9s ease both .1s;}
.hero h1 .hl{background:linear-gradient(90deg,var(--cyan),var(--bright-blue),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{max-width:620px;color:var(--muted);font-size:1.1rem;font-weight:300;line-height:1.8;margin-bottom:2.5rem;animation:fadeDown 1s ease both .2s;}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;animation:fadeDown 1.1s ease both .3s;}
.btn-primary{background:linear-gradient(135deg,var(--bright-blue),var(--cyan));color:var(--deep-navy);font-family:'Orbitron',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:1.5px;padding:.85rem 2.2rem;border-radius:30px;border:none;cursor:pointer;transition:all .3s;text-transform:uppercase;}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(0,212,255,.35);}
.btn-secondary{background:transparent;color:var(--cyan);font-family:'Orbitron',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:1.5px;padding:.85rem 2.2rem;border-radius:30px;border:1px solid rgba(0,212,255,.4);cursor:pointer;transition:all .3s;text-transform:uppercase;}
.btn-secondary:hover{background:rgba(0,212,255,.08);transform:translateY(-3px);border-color:var(--cyan);}
.section{padding:5rem 2rem;position:relative;z-index:1;}
.section-header{text-align:center;margin-bottom:3.5rem;}
.section-header .eyebrow{font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:var(--cyan);margin-bottom:.75rem;}
.section-header h2{font-family:'Orbitron',sans-serif;font-size:clamp(1.6rem,3vw,2.4rem);font-weight:700;}
.section-header p{color:var(--muted);margin-top:.75rem;font-size:1rem;max-width:500px;margin-left:auto;margin-right:auto;}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;max-width:1100px;margin:0 auto;}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:2rem;backdrop-filter:blur(12px);transition:all .3s;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0;transition:opacity .3s;}
.card:hover{transform:translateY(-6px);border-color:rgba(0,212,255,.5);}
.card:hover::before{opacity:1;}
.card-icon{font-size:2.2rem;margin-bottom:1.2rem;display:block;}
.card h3{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;margin-bottom:.75rem;letter-spacing:.5px;}
.card p{color:var(--muted);font-size:.9rem;line-height:1.7;}
.steps{max-width:900px;margin:0 auto;}
.step{display:flex;gap:2rem;align-items:flex-start;margin-bottom:2rem;padding:1.8rem;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;backdrop-filter:blur(12px);transition:all .3s;}
.step:hover{border-color:rgba(0,212,255,.45);transform:translateX(6px);}
.step-num{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;color:var(--cyan);min-width:50px;text-shadow:0 0 20px rgba(0,212,255,.5);}
.step-body h3{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;margin-bottom:.5rem;}
.step-body p{color:var(--muted);font-size:.9rem;line-height:1.7;}
.stats-strip{background:linear-gradient(135deg,rgba(7,21,64,.9),rgba(26,77,204,.2));border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:3rem 2rem;display:flex;justify-content:center;gap:4rem;flex-wrap:wrap;}
.stat{text-align:center;}
.stat-num{font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:900;color:var(--cyan);text-shadow:0 0 25px rgba(0,212,255,.4);}
.stat-label{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:.3rem;}

/* DEMO */
.demo-layout{max-width:860px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
.demo-title{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:700;text-align:center;margin-bottom:.4rem;}
.demo-desc{text-align:center;color:var(--muted);margin-bottom:2rem;font-size:.95rem;}
.mode-tabs{display:flex;background:rgba(2,8,24,.6);border:1px solid var(--border);border-radius:40px;padding:4px;margin-bottom:1.8rem;max-width:320px;margin-left:auto;margin-right:auto;}
.mode-tab{flex:1;padding:.6rem 1rem;border-radius:36px;border:none;background:transparent;color:var(--muted);font-family:'Exo 2',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:.4rem;}
.mode-tab.active{background:linear-gradient(135deg,var(--bright-blue),var(--cyan));color:var(--deep-navy);}
.demo-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:2rem;backdrop-filter:blur(16px);margin-bottom:1.5rem;}
.demo-panel h3{font-family:'Orbitron',sans-serif;font-size:.82rem;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:1.2rem;display:flex;align-items:center;gap:.6rem;}
.voice-section{display:flex;flex-direction:column;align-items:center;}
.mic-btn{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--bright-blue),var(--cyan));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:1rem;transition:all .3s;box-shadow:0 0 30px rgba(0,212,255,.3);}
.mic-btn:hover{transform:scale(1.08);box-shadow:0 0 50px rgba(0,212,255,.5);}
.mic-btn.recording{animation:pulseRed 1.2s ease-in-out infinite;background:linear-gradient(135deg,#c0392b,#ff6060);}
@keyframes pulseRed{0%{box-shadow:0 0 0 0 rgba(255,96,96,.6);}70%{box-shadow:0 0 0 22px rgba(255,96,96,0);}100%{box-shadow:0 0 0 0 rgba(255,96,96,0);}}
.mic-status{color:var(--muted);font-size:.85rem;margin-bottom:1rem;text-align:center;min-height:1.4em;line-height:1.4;}
.interim-box{width:100%;background:rgba(2,8,24,.5);border:1px dashed var(--border);border-radius:10px;padding:.8rem 1rem;min-height:44px;color:rgba(122,144,192,.7);font-family:'Exo 2',sans-serif;font-size:.88rem;line-height:1.6;font-style:italic;margin-bottom:.75rem;display:none;}
.interim-box.show{display:block;}
.transcript-output{width:100%;background:rgba(2,8,24,.55);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;min-height:80px;color:var(--white);font-family:'Exo 2',sans-serif;font-size:.96rem;line-height:1.7;}
.transcript-output.empty{color:rgba(122,144,192,.45);font-style:italic;}
.write-section{display:none;}
.write-section.show{display:block;}
.write-textarea{width:100%;min-height:130px;background:rgba(2,8,24,.55);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;color:var(--white);font-family:'Exo 2',sans-serif;font-size:.96rem;line-height:1.7;outline:none;resize:vertical;transition:border .25s;}
.write-textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.1);}
.write-textarea::placeholder{color:rgba(122,144,192,.45);}
.char-count{text-align:right;font-size:.75rem;color:var(--muted);margin-top:.4rem;}
.action-row{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;margin-top:1.5rem;}
.btn-retry{background:rgba(240,180,41,.1);border:1px solid rgba(240,180,41,.35);color:var(--gold);font-family:'Orbitron',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:1.5px;padding:.75rem 1.8rem;border-radius:30px;cursor:pointer;transition:all .3s;text-transform:uppercase;display:none;align-items:center;gap:.5rem;}
.btn-retry:hover{background:rgba(240,180,41,.2);transform:translateY(-2px);}
.btn-retry.show{display:inline-flex;}
.btn-analyze{background:linear-gradient(135deg,var(--bright-blue),var(--cyan));color:var(--deep-navy);font-family:'Orbitron',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:1.5px;padding:.75rem 2rem;border-radius:30px;border:none;cursor:pointer;transition:all .3s;text-transform:uppercase;}
.btn-analyze:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,212,255,.3);}
.btn-analyze:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.analysis-result{display:none;}
.analysis-result.show{display:block;}
.result-item{background:rgba(2,8,24,.5);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;padding:1rem 1.2rem;margin-bottom:.8rem;}
.result-item.err-item{border-left-color:var(--red);}
.result-item.fix-item{border-left-color:var(--green);}
.result-item.enh-item{border-left-color:var(--gold);}
.result-label{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem;}
.result-text{font-size:.92rem;color:var(--white);line-height:1.6;}
.movie-match{display:flex;align-items:center;gap:1.5rem;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.22);border-radius:14px;padding:1.2rem 1.5rem;margin-top:1rem;flex-wrap:wrap;}
.movie-thumb{width:60px;height:80px;background:linear-gradient(135deg,var(--accent-blue),var(--bright-blue));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;}
.movie-info h4{font-family:'Orbitron',sans-serif;font-size:.95rem;margin-bottom:.3rem;}
.movie-info p{color:var(--muted);font-size:.82rem;}
.match-badge{margin-left:auto;background:rgba(77,255,145,.12);color:var(--green);border:1px solid rgba(77,255,145,.3);border-radius:20px;padding:.3rem .9rem;font-size:.75rem;letter-spacing:1px;font-weight:600;text-transform:uppercase;}
.fluency-row{display:flex;align-items:center;gap:1rem;margin-top:.6rem;}
.fluency-bar{flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.fluency-fill{height:100%;background:linear-gradient(90deg,var(--bright-blue),var(--cyan));border-radius:4px;transition:width 1.2s ease;width:0%;}
.spinner{display:none;text-align:center;padding:1.5rem;}
.spinner.show{display:block;}
.spinner-ring{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto .8rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.notice-box{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.2);border-radius:10px;padding:.75rem 1rem;font-size:.8rem;color:var(--muted);margin-top:1rem;line-height:1.6;}
.notice-box span{color:var(--cyan);}

/* AUTH */
.auth-container{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;}
.auth-box{width:100%;max-width:430px;background:rgba(7,21,64,.85);border:1px solid var(--border);border-radius:24px;padding:2.8rem 2.5rem;backdrop-filter:blur(20px);position:relative;overflow:hidden;}
.auth-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--bright-blue),var(--cyan),var(--gold));}
.auth-logo{font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:800;color:var(--cyan);text-align:center;margin-bottom:.5rem;letter-spacing:2px;text-shadow:0 0 20px rgba(0,212,255,.4);}
.auth-logo span{color:var(--gold);}
.auth-subtitle{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:2rem;}
.auth-tabs{display:flex;background:rgba(2,8,24,.5);border-radius:30px;padding:4px;margin-bottom:2rem;border:1px solid var(--border);}
.auth-tab{flex:1;padding:.55rem;border-radius:26px;border:none;background:transparent;color:var(--muted);font-family:'Exo 2',sans-serif;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .25s;}
.auth-tab.active{background:linear-gradient(135deg,var(--bright-blue),var(--cyan));color:var(--deep-navy);}
.form-group{margin-bottom:1.2rem;}
.form-group label{display:block;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
.form-group input{width:100%;background:rgba(2,8,24,.6);border:1px solid var(--border);border-radius:10px;padding:.8rem 1.1rem;color:var(--white);font-family:'Exo 2',sans-serif;font-size:.95rem;outline:none;transition:all .25s;}
.form-group input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.12);}
.form-group input::placeholder{color:rgba(122,144,192,.45);}
.form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;}
.form-row label{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;cursor:pointer;}
.form-row a{font-size:.82rem;color:var(--cyan);text-decoration:none;cursor:pointer;}
.btn-auth{width:100%;background:linear-gradient(135deg,var(--bright-blue),var(--cyan));color:var(--deep-navy);font-family:'Orbitron',sans-serif;font-weight:700;font-size:.88rem;letter-spacing:2px;padding:.9rem;border-radius:30px;border:none;cursor:pointer;transition:all .3s;text-transform:uppercase;}
.btn-auth:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,212,255,.35);}
.divider{display:flex;align-items:center;gap:1rem;margin:1.4rem 0;color:var(--muted);font-size:.8rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.btn-google{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:.75rem;color:var(--white);font-size:.88rem;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:.75rem;font-family:'Exo 2',sans-serif;font-weight:500;}
.btn-google:hover{border-color:var(--cyan);background:rgba(0,212,255,.07);}
.google-icon{width:20px;height:20px;flex-shrink:0;}
.signup-fields{display:none;}
.signin-fields{display:block;}
.error-msg{background:rgba(255,96,96,.1);border:1px solid rgba(255,96,96,.3);border-radius:10px;padding:.8rem 1rem;color:var(--red);font-size:.85rem;margin-bottom:1rem;display:none;}
.error-msg.show{display:block;}
.success-msg{background:rgba(77,255,145,.08);border:1px solid rgba(77,255,145,.25);border-radius:10px;padding:.8rem 1rem;color:var(--green);font-size:.85rem;margin-bottom:1rem;display:none;text-align:center;}
.success-msg.show{display:block;}

footer{position:relative;z-index:1;background:rgba(2,8,24,.9);border-top:1px solid var(--border);padding:1.8rem;text-align:center;color:var(--muted);font-size:.82rem;}
footer strong{color:var(--cyan);}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){nav{padding:0 1rem;}.nav-links a{padding:.35rem .55rem;font-size:.72rem;}.auth-box{padding:2rem 1.4rem;}.step{flex-direction:column;gap:.75rem;}.stats-strip{gap:2rem;}.movie-match{flex-direction:column;align-items:flex-start;}.match-badge{margin-left:0;}}
</style>
</head>
<body>
<canvas id="stars-canvas"></canvas>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>

<!-- NAV — no About -->
<nav>
  <div class="nav-brand" onclick="showPage('home')">CINE<span>SPEAK</span> AI</div>
  <ul class="nav-links">
    <li><a onclick="showPage('home')" id="nav-home" class="active">Home</a></li>
    <li><a onclick="showPage('features')" id="nav-features">Features</a></li>
    <li><a onclick="showPage('demo')" id="nav-demo">Demo</a></li>
    <li><a onclick="showPage('signin')" id="nav-signin" class="nav-cta">Sign In</a></li>
  </ul>
</nav>

<!-- HOME -->
<div id="page-home" class="page active">
  <section class="hero">
    <div class="hero-badge">🎬 AI-Powered English Enhancement</div>
    <h1>Describe Movies.<br>Master <span class="hl">English.</span></h1>
    <p>Watch films in any language — Tamil, Hindi, Telugu, or global cinema — then describe them in English. Our AI corrects grammar, enriches vocabulary, and identifies the exact movie you're talking about.</p>
    <div class="hero-btns">
      <button class="btn-primary" onclick="showPage('demo')">Try Live Demo</button>
      <button class="btn-secondary" onclick="showPage('features')">Explore Features</button>
    </div>
  </section>
  <div class="stats-strip">
    <div class="stat"><div class="stat-num">50K+</div><div class="stat-label">Movies in DB</div></div>
    <div class="stat"><div class="stat-num">98%</div><div class="stat-label">Recognition Accuracy</div></div>
    <div class="stat"><div class="stat-num">12+</div><div class="stat-label">Languages Supported</div></div>
    <div class="stat"><div class="stat-num">25K+</div><div class="stat-label">Active Learners</div></div>
  </div>
  <section class="section">
    <div class="section-header"><div class="eyebrow">How it works</div><h2>Three Steps to Fluency</h2><p>Voice or Text → AI Analysis → Enhanced English</p></div>
    <div class="steps">
      <div class="step"><div class="step-num">01</div><div class="step-body"><h3>Speak or Type Your Description</h3><p>Watch any movie in any language. Use the mic to speak in English or type your description — then let the AI do its work.</p></div></div>
      <div class="step"><div class="step-num">02</div><div class="step-body"><h3>AI Analyzes & Identifies</h3><p>NLP detects grammar errors, vocabulary issues, and fluency problems. The system simultaneously identifies the film from your description.</p></div></div>
      <div class="step"><div class="step-num">03</div><div class="step-body"><h3>Get Corrected English + Retry</h3><p>Receive corrections with improved structure and richer vocabulary. Use the Retry button to try again and see how much you've improved.</p></div></div>
    </div>
  </section>
  <footer>&copy; 2025 <strong>CineSpeak AI</strong> · Empowering English through Cinema</footer>
</div>

<!-- FEATURES -->
<div id="page-features" class="page">
  <section class="section" style="padding-top:3rem">
    <div class="section-header"><div class="eyebrow">Platform Capabilities</div><h2>Everything You Need</h2><p>A complete AI ecosystem for movie-powered English learning.</p></div>
    <div class="cards-grid">
      <div class="card"><span class="card-icon">🎙️</span><h3>Voice Recognition</h3><p>Advanced speech-to-text converts your spoken English into accurate text in real time. Your actual words — not default text — are captured and analyzed.</p></div>
      <div class="card"><span class="card-icon">✍️</span><h3>Text Input Mode</h3><p>Prefer typing? Switch to Write mode and type your movie description directly. The same full AI analysis applies to both voice and written input.</p></div>
