<script>
/* STARS */
const canvas=document.getElementById('stars-canvas'),ctx=canvas.getContext('2d');let stars=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
function initStars(){stars=[];const n=Math.floor(canvas.width*canvas.height/5500);for(let i=0;i<n;i++)stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.6+.2,speed:Math.random()*.25+.04,opacity:Math.random()*.7+.1,twSpeed:Math.random()*.02+.005,twPhase:Math.random()*Math.PI*2,drift:(Math.random()-.5)*.12});}
function drawStars(){ctx.clearRect(0,0,canvas.width,canvas.height);stars.forEach(s=>{s.twPhase+=s.twSpeed;const a=s.opacity*(.6+.4*Math.sin(s.twPhase));s.y-=s.speed;s.x+=s.drift;if(s.y<-5){s.y=canvas.height+5;s.x=Math.random()*canvas.width;}if(s.x<-5)s.x=canvas.width+5;if(s.x>canvas.width+5)s.x=-5;const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);g.addColorStop(0,`rgba(180,210,255,${a})`);g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(s.x,s.y,s.r*4,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(220,235,255,${Math.min(a*1.5,1)})`;ctx.fill();});requestAnimationFrame(drawStars);}
window.addEventListener('resize',()=>{resizeCanvas();initStars();});resizeCanvas();initStars();requestAnimationFrame(drawStars);

/* NAV */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-links a').forEach(a=>a.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  const n=document.getElementById('nav-'+id);if(n)n.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  if(id==='demo')resetDemo();
}

/* AUTH */
function switchTab(t){
  const s=t==='signin';
  document.getElementById('tab-signin').classList.toggle('active',s);
  document.getElementById('tab-signup').classList.toggle('active',!s);
  document.getElementById('signin-fields').style.display=s?'block':'none';
  document.getElementById('signup-fields').style.display=s?'none':'block';
  clearAuthMsgs();
}
function clearAuthMsgs(){document.getElementById('auth-error').classList.remove('show');document.getElementById('auth-success').classList.remove('show');}
function showAuthError(m){const e=document.getElementById('auth-error');e.textContent=m;e.classList.add('show');document.getElementById('auth-success').classList.remove('show');}
function showAuthSuccess(m){const e=document.getElementById('auth-success');e.textContent=m;e.classList.add('show');document.getElementById('auth-error').classList.remove('show');}

function handleSignIn(){
  const email=document.getElementById('si-email').value.trim();
  const pass=document.getElementById('si-pass').value;
  if(!email){showAuthError('Please enter your email address.');return;}
  if(!email.includes('@')){showAuthError('Please enter a valid email address.');return;}
  if(!pass){showAuthError('Please enter your password.');return;}
  showAuthSuccess('✓ Signed in successfully! Redirecting…');
  setTimeout(()=>showPage('demo'),1200);
}
function handleSignUp(){
  const name=document.getElementById('su-name').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const pass=document.getElementById('su-pass').value;
  const confirm=document.getElementById('su-confirm').value;
  const agreed=document.getElementById('su-agree').checked;
  if(!name){showAuthError('Please enter your full name.');return;}
  if(!email||!email.includes('@')){showAuthError('Please enter a valid email address.');return;}
  if(pass.length<8){showAuthError('Password must be at least 8 characters.');return;}
  if(pass!==confirm){showAuthError('Passwords do not match.');return;}
  if(!agreed){showAuthError('Please agree to the Terms of Service to continue.');return;}
  showAuthSuccess('✓ Account created! Welcome to CineSpeak AI!');
  setTimeout(()=>showPage('demo'),1400);
}
function handleGoogle(){showAuthError('Google Sign-In requires OAuth backend integration. Please use email/password for this demo.');}
function showForgot(){const e=document.getElementById('si-email').value.trim();if(e)showAuthSuccess('Password reset link sent to '+e+' (demo).');else showAuthError('Enter your email above first, then click Forgot Password.');}

/* DEMO STATE */
let currentMode='voice',transcriptText='',recognition=null,isRecording=false;

function setMode(mode){
  currentMode=mode;
  document.getElementById('tab-voice').classList.toggle('active',mode==='voice');
  document.getElementById('tab-write').classList.toggle('active',mode==='write');
  document.getElementById('voice-section').style.display=mode==='voice'?'flex':'none';
  if(mode==='voice')document.getElementById('voice-section').style.flexDirection='column';
  document.getElementById('write-section').classList.toggle('show',mode==='write');
  document.getElementById('input-panel-title').textContent=mode==='voice'?'🎤 Voice Input':'✍️ Write Your Description';
  resetResults();
}

function resetDemo(){
  stopRecording();
  transcriptText='';
  const out=document.getElementById('transcript-output');
  out.textContent='Your speech will appear here in real time…';out.classList.add('empty');
  document.getElementById('interim-box').classList.remove('show');
  document.getElementById('mic-status').textContent='Click the mic to start speaking';
  document.getElementById('mic-btn').textContent='🎤';
  document.getElementById('write-input').value='';
  document.getElementById('char-count').textContent='0';
  resetResults();
  setMode('voice');
}
function resetResults(){
  document.getElementById('analysis-panel').classList.remove('show');
  document.getElementById('results-content').innerHTML='';
  document.getElementById('spinner').classList.remove('show');
  document.getElementById('btn-retry').classList.remove('show');
  document.getElementById('btn-analyze').disabled=false;
}
function updateCharCount(){document.getElementById('char-count').textContent=document.getElementById('write-input').value.length;}

/* VOICE */
function toggleMic(){if(isRecording)stopRecording();else startRecording();}

function startRecording(){
  const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SRC){
    document.getElementById('mic-status').textContent='⚠️ Speech recognition not supported. Use Chrome/Edge, or switch to Write mode.';
    return;
  }
  // Clear previous transcript
  transcriptText='';
  const out=document.getElementById('transcript-output');
  out.textContent='';out.classList.remove('empty');
  const interimBox=document.getElementById('interim-box');
  resetResults();

  recognition=new SRC();
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.lang='en-US';
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{
    isRecording=true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-btn').textContent='⏹';
    document.getElementById('mic-status').textContent='🔴 Recording… speak now. Click ⏹ to stop.';
    interimBox.classList.add('show');
    interimBox.textContent='Waiting for speech…';
  };

  recognition.onresult=(e)=>{
    let interim='',final='';
    for(let i=0;i<e.results.length;i++){
      if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';
      else interim+=e.results[i][0].transcript;
    }
    if(final.trim()){
      transcriptText=final.trim();
      out.textContent=transcriptText;
      out.classList.remove('empty');
    }
    interimBox.textContent=interim||'…';
  };

  recognition.onerror=(e)=>{
    stopRecording();
    const msgs={
      'not-allowed':'⚠️ Microphone access denied. Allow mic permission in your browser settings.',
      'no-speech':'No speech detected. Please try again.',
      'audio-capture':'No microphone found. Please connect a mic.',
      'network':'Network error during recognition. Check your connection.'
    };
    document.getElementById('mic-status').textContent=msgs[e.error]||('Error: '+e.error+'. Please try again.');
  };

  recognition.onend=()=>{ stopRecording(); };
  try{ recognition.start(); } catch(e){ document.getElementById('mic-status').textContent='Could not start mic: '+e.message; }
}

function stopRecording(){
  isRecording=false;
  if(recognition){try{recognition.stop();}catch(e){}recognition=null;}
  const btn=document.getElementById('mic-btn');
  btn.classList.remove('recording');btn.textContent='🎤';
  const hasSpeech=transcriptText.trim().length>0;
  document.getElementById('mic-status').textContent=hasSpeech
    ?'✅ Done! Your description is captured. Click Analyze to proceed.'
    :'Click the mic to start speaking';
  document.getElementById('interim-box').classList.remove('show');
}

/* ANALYSIS */
function getInputText(){
  return currentMode==='voice'?transcriptText.trim():document.getElementById('write-input').value.trim();
}

function runAnalysis(){
  const text=getInputText();
  if(!text){
    if(currentMode==='voice'){
      document.getElementById('mic-status').textContent='⚠️ Please record your voice description first, then click Analyze.';
    } else {
      const ta=document.getElementById('write-input');
      ta.style.borderColor='var(--red)';
      ta.focus();
      setTimeout(()=>ta.style.borderColor='',2000);
    }
    return;
  }
  document.getElementById('write-input').style.borderColor='';
  resetResults();
  document.getElementById('spinner').classList.add('show');
  document.getElementById('btn-analyze').disabled=true;
  setTimeout(()=>{
    document.getElementById('spinner').classList.remove('show');
    document.getElementById('btn-analyze').disabled=false;
    renderResults(text);
  },1600);
}

function renderResults(inputText){
  const rules=[
    {re:/\bare\b(?=\s+(very\s+)?brave)/gi,fix:'is',msg:'Subject-verb agreement: use "is" (singular hero), not "are"'},
    {re:/\bfighted\b/gi,fix:'fought',msg:'"fighted" is incorrect — past tense of "fight" is "fought"'},
    {re:/\ba(?=\s+undercover)/gi,fix:'an',msg:'Use "an" before vowel sounds: "an undercover"'},
    {re:/\bbad peoples\b/gi,fix:'bad people',msg:'"peoples" → "people" (uncountable noun, no plural -s)'},
    {re:/\bpeoples\b/gi,fix:'people',msg:'"peoples" → "people"'},
    {re:/\bhe go\b/gi,fix:'he goes',msg:'Subject-verb agreement: "he goes" not "he go"'},
    {re:/\bshe go\b/gi,fix:'she goes',msg:'Subject-verb agreement: "she goes" not "she go"'},
    {re:/\bthey was\b/gi,fix:'they were',msg:'"was" → "were" with plural subject "they"'},
    {re:/\bhe don'?t\b/gi,fix:"he doesn't",msg:'"don\'t" → "doesn\'t" for third-person singular'},
    {re:/\bmore better\b/gi,fix:'better',msg:'Double comparative — remove "more"; just "better"'},
    {re:/\bvery unique\b/gi,fix:'unique',msg:'"unique" means one-of-a-kind; it needs no intensifier'},
    {re:/\bhe are\b/gi,fix:'he is',msg:'"he are" → "he is"'},
    {re:/\bshe are\b/gi,fix:'she is',msg:'"she are" → "she is"'},
    {re:/\bI is\b/gi,fix:'I am',msg:'"I is" → "I am"'},
    {re:/\bwas go\b/gi,fix:'went',msg:'"was go" → "went"'},
    {re:/\bcan able\b/gi,fix:'can',msg:'"can able" — use either "can" or "is able to", not both'},
    {re:/\bdid went\b/gi,fix:'went',msg:'"did went" → "went"'},
    {re:/\bmore faster\b/gi,fix:'faster',msg:'Double comparative: just "faster"'},
    {re:/\bvery much big\b/gi,fix:'very big',msg:'Rephrase to "very big"'},
  ];

  let corrected=inputText;
  let errorsFound=[];
  rules.forEach(r=>{
    r.re.lastIndex=0;
    if(r.re.test(corrected)){
      r.re.lastIndex=0;
      const match=corrected.match(r.re);
      if(match) errorsFound.push({msg:r.msg,orig:match[0],fix:r.fix});
      r.re.lastIndex=0;
      corrected=corrected.replace(r.re,r.fix);
    }
  });

  // Vocab enhancement
  const enhanced=corrected
    .replace(/\bvery brave\b/gi,'exceptionally courageous')
    .replace(/\bbrave\b/gi,'valiant')
    .replace(/\bvillain(s)?\b/gi,'antagonist$1')
    .replace(/\bhero\b/gi,'protagonist')
    .replace(/\bstory\b/gi,'narrative')
    .replace(/\bfight\b/gi,'confrontation')
    .replace(/\btrying to stop\b/gi,'endeavouring to prevent')
    .replace(/\bvery good\b/gi,'exceptional')
    .replace(/\bvery sad\b/gi,'profoundly melancholic')
    .replace(/\bvery funny\b/gi,'hilariously entertaining')
    .replace(/\bgood movie\b/gi,'compelling film')
    .replace(/\bold movie\b/gi,'classic film')
    .replace(/\bbig fight\b/gi,'climactic confrontation')
    .replace(/\bbad guy(s)?\b/gi,'antagonist$1')
    .replace(/\bkill(ed)?\b/gi,'eliminate$1')
    .replace(/\brun away\b/gi,'flee the scene');

  const movie=detectMovie(inputText);
  const wc=inputText.split(/\s+/).filter(Boolean).length;
  const penalty=errorsFound.length*7;
  const bonus=Math.min(wc*1.5,35);
  const score=Math.min(Math.max(Math.round(60+bonus-penalty),25),98);

  let html='';
  if(errorsFound.length===0){
    html+=`<div class="result-item fix-item"><div class="result-label">Grammar Check</div><div class="result-text" style="color:var(--green);">✓ No major grammar errors detected. Great job!</div></div>`;
  } else {
    errorsFound.forEach(e=>{
      html+=`<div class="result-item err-item"><div class="result-label">⚠ Grammar Issue</div><div class="result-text">${escH(e.msg)}</div></div>`;
    });
    html+=`<div class="result-item fix-item"><div class="result-label">✓ Corrected Version</div><div class="result-text" style="color:var(--green);">${escH(corrected)}</div></div>`;
  }

  html+=`<div class="result-item enh-item"><div class="result-label">✨ Enhanced Version (improved vocabulary)</div><div class="result-text" style="color:var(--gold);">${escH(enhanced)}</div></div>`;

  html+=`<h3 style="margin-top:1.5rem;">🎬 Movie Match</h3>
  <div class="movie-match">
    <div class="movie-thumb">🎞️</div>
    <div class="movie-info">
      <h4>${movie.title}</h4>
      <p>${movie.genre} · ${movie.lang} · ${movie.dir}</p>
      <p style="color:var(--muted);font-size:.78rem;margin-top:.3rem;">Confidence: ${movie.conf}%</p>
    </div>
    <div class="match-badge">✓ ${movie.conf>=80?'Matched':'Possible'}</div>
  </div>`;

  html+=`<div style="margin-top:1.5rem;padding:1.2rem;background:rgba(0,212,255,.05);border-radius:12px;border:1px solid rgba(0,212,255,.15);">
    <div class="result-label">Fluency Score</div>
    <div class="fluency-row">
      <div class="fluency-bar"><div class="fluency-fill" id="fluency-fill"></div></div>
      <span style="font-family:'Orbitron',sans-serif;color:var(--cyan);font-weight:700;">${score}/100</span>
    </div>
    <p style="color:var(--muted);font-size:.8rem;margin-top:.6rem;">${getTip(score)}</p>
  </div>`;

  document.getElementById('results-content').innerHTML=html;
  document.getElementById('analysis-panel').classList.add('show');
  document.getElementById('btn-retry').classList.add('show');
  setTimeout(()=>{
    const f=document.getElementById('fluency-fill');if(f)f.style.width=score+'%';
    document.getElementById('analysis-panel').scrollIntoView({behavior:'smooth',block:'start'});
  },80);
}

function detectMovie(text){
  const t=text.toLowerCase();
  const db=[
    {kw:['vikram','undercover','cop','drugs','chennai','lokesh'],title:'Vikram (2022)',genre:'Action',lang:'Tamil',dir:'Dir. Lokesh Kanagaraj',conf:94},
    {kw:['kgf','gold','mine','rocky','yash'],title:'KGF: Chapter 2 (2022)',genre:'Action Drama',lang:'Kannada',dir:'Dir. Prashanth Neel',conf:91},
    {kw:['baahubali','kingdom','prince','war','prabhas'],title:'Baahubali (2015)',genre:'Epic Action',lang:'Telugu',dir:'Dir. S.S. Rajamouli',conf:90},
    {kw:['pushpa','smuggling','forest','flower','allu'],title:'Pushpa: The Rise (2021)',genre:'Action',lang:'Telugu',dir:'Dir. Sukumar',conf:88},
    {kw:['master','teacher','college','villain','youth','thalapathy'],title:'Master (2021)',genre:'Action Thriller',lang:'Tamil',dir:'Dir. Lokesh Kanagaraj',conf:86},
    {kw:['3 idiots','engineer','college','friends','exam'],title:'3 Idiots (2009)',genre:'Comedy Drama',lang:'Hindi',dir:'Dir. Rajkumar Hirani',conf:89},
    {kw:['dangal','wrestling','daughter','father'],title:'Dangal (2016)',genre:'Sports Drama',lang:'Hindi',dir:'Dir. Nitesh Tiwari',conf:87},
    {kw:['robot','android','machine','sci-fi','rajini'],title:'Enthiran / Robot (2010)',genre:'Sci-Fi Action',lang:'Tamil',dir:'Dir. Shankar',conf:85},
    {kw:['love','romance','couple','relationship','girl','boy'],title:'OK Kanmani (2015)',genre:'Romance',lang:'Tamil',dir:'Dir. Mani Ratnam',conf:70},
    {kw:['kaithi','prison','escape','dark','night'],title:'Kaithi (2019)',genre:'Action Thriller',lang:'Tamil',dir:'Dir. Lokesh Kanagaraj',conf:82},
    {kw:['jailer','officer','retired','son','family'],title:'Jailer (2023)',genre:'Action',lang:'Tamil',dir:'Dir. Nelson Dilipkumar',conf:83},
    {kw:['leo','spy','gangster','krishna','past'],title:'Leo (2023)',genre:'Action Thriller',lang:'Tamil',dir:'Dir. Lokesh Kanagaraj',conf:84},
  ];
  let best=null,bestScore=0;
  db.forEach(m=>{let s=0;m.kw.forEach(k=>{if(t.includes(k))s++;});if(s>bestScore){bestScore=s;best=m;}});
  if(best&&bestScore>=2)return best;
  return{title:'Movie Not Identified',genre:'Unknown',lang:'—',dir:'Add more plot / actor / location details',conf:0};
}

function getTip(s){
  if(s>=88)return'Excellent fluency! Your English expression is impressive — try more complex sentence structures next time.';
  if(s>=72)return'Good fluency! Focus on consistent tense usage and enriching your vocabulary further.';
  if(s>=55)return'Fair fluency. Work on subject-verb agreement and sentence variety.';
  return'Keep practicing! Focus on basic grammar — tenses, articles (a/an/the), and singular/plural forms.';
}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* RETRY — clears input, shows fresh panel ready to go again */
function retryInput(){
  transcriptText='';
  const out=document.getElementById('transcript-output');
  out.textContent='Your speech will appear here in real time…';out.classList.add('empty');
  document.getElementById('mic-status').textContent='Ready! Click the mic and try your description again.';
  document.getElementById('mic-btn').textContent='🎤';
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('interim-box').classList.remove('show');
  document.getElementById('write-input').value='';
  document.getElementById('char-count').textContent='0';
  document.getElementById('analysis-panel').classList.remove('show');
  document.getElementById('results-content').innerHTML='';
  document.getElementById('btn-retry').classList.remove('show');
  document.getElementById('btn-analyze').disabled=false;
  document.querySelector('.demo-layout').scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
